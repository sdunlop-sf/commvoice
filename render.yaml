services:
  - type: web
    name: commvoice
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Set this in the Render dashboard (Environment tab) — never commit a real key.
      - key: GEMINI_API_KEY
        sync: false
